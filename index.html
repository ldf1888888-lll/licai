<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>极简智能行情定投分配系统</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: #0B1120;
    padding: 20px 14px 50px;
    line-height: 1.55;
  }

  .container {
    max-width: 620px;
    margin: 0 auto;
  }

  .card {
    background-color: #1E293B;
    border: 1.5px solid #475569;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
  }

  .sec-header {
    font-size: 1.15rem;
    font-weight: 900;
    padding-bottom: 12px;
    margin-bottom: 16px;
    border-bottom: 1.5px solid #334155;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  /* 输入区行样式 */
  .input-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 10px;
    flex-wrap: wrap;
  }

  .input-label {
    font-size: 1rem;
    font-weight: 800;
    min-width: 110px;
  }

  .input-box {
    background-color: #0F172A;
    border: 1.5px solid #64748B;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 1.15rem;
    font-weight: 800;
    font-family: Consolas, Monaco, monospace;
    width: 150px;
    text-align: right;
    outline: none;
  }

  .input-box:focus {
    border-color: #FFFFFF;
    background-color: #020617;
  }

  .living-inline {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
    flex: 1;
  }

  .month-living-tag {
    background-color: #0F172A;
    border: 1px solid #475569;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 800;
    font-family: Consolas, Monaco, monospace;
  }

  .investable-bar {
    margin-top: 14px;
    padding: 14px 16px;
    background-color: #0F172A;
    border: 2px solid #10B981;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .investable-title {
    font-size: 1.1rem;
    font-weight: 900;
  }

  .investable-val {
    font-size: 1.75rem;
    font-weight: 900;
    font-family: Consolas, Monaco, monospace;
    color: #10B981;
  }

  /* 按钮样式 */
  .btn-refresh {
    background-color: #10B981;
    border: 1.5px solid #FFFFFF;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 0.86rem;
    font-weight: 900;
    cursor: pointer;
  }

  .btn-refresh:active { transform: scale(0.97); }
  .btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; }

  /* 四大分配区块 */
  .alloc-block {
    background-color: #0F172A;
    border: 1.5px solid #334155;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }

  .alloc-block:last-child { margin-bottom: 0; }

  .alloc-main-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding-bottom: 10px;
    border-bottom: 1px dashed #334155;
  }

  .alloc-cat-title {
    font-size: 1.05rem;
    font-weight: 900;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .pct-pill {
    background-color: #1E293B;
    border: 1.5px solid #94A3B8;
    padding: 2px 9px;
    border-radius: 6px;
    font-family: Consolas, Monaco, monospace;
    font-size: 1rem;
    font-weight: 900;
  }

  .amt-display {
    font-size: 1.45rem;
    font-weight: 900;
    font-family: Consolas, Monaco, monospace;
    color: #10B981;
    white-space: nowrap;
  }

  /* 推荐基金代码子项 */
  .code-list {
    margin-top: 10px;
  }

  .code-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: rgba(255, 255, 255, 0.05);
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 6px;
    gap: 8px;
    flex-wrap: wrap;
  }

  .code-left {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    font-size: 0.9rem;
    font-weight: 700;
  }

  .tag {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 800;
  }

  .tag-sector { background-color: #1D4ED8; border: 1px solid #60A5FA; }
  .tag-cycle-long { background-color: #047857; border: 1px solid #34D399; }
  .tag-cycle-half { background-color: #B45309; border: 1px solid #FBBF24; }
  .tag-limit { background-color: #7C2D12; border: 1px solid #FB923C; }

  .code-right {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: Consolas, Monaco, monospace;
    font-weight: 800;
    font-size: 0.95rem;
  }

  .btn-del {
    background-color: rgba(239, 68, 68, 0.3);
    border: 1px solid #EF4444;
    border-radius: 5px;
    padding: 1px 7px;
    font-size: 0.8rem;
    font-weight: 900;
    cursor: pointer;
  }

  /* 加减代码操作栏 */
  .add-bar {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .add-input {
    background-color: #1E293B;
    border: 1px solid #64748B;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 0.82rem;
    font-family: Consolas, Monaco, monospace;
    width: 95px;
    outline: none;
  }

  .add-sector {
    background-color: #1E293B;
    border: 1px solid #64748B;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 0.82rem;
    width: 110px;
    outline: none;
  }

  .btn-add {
    background-color: #334155;
    border: 1px solid #94A3B8;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 0.8rem;
    font-weight: 800;
    cursor: pointer;
  }

  /* 纳斯达克限额核查微调行 */
  .limit-bar {
    margin-top: 6px;
    font-size: 0.78rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    opacity: 0.92;
  }

  .limit-select {
    background-color: #1E293B;
    border: 1px solid #64748B;
    border-radius: 5px;
    padding: 2px 6px;
    font-size: 0.78rem;
    font-weight: 700;
  }
</style>
</head>
<body>

<div class="container">
  <!-- ==================== 第一部分：输入区 ==================== -->
  <div class="card">
    <div class="sec-header">
      <span>输入：</span>
      <span id="syncStatusText" style="font-size:0.78rem; font-weight:normal; opacity:0.85;">正在连接行情系统...</span>
    </div>

    <div class="input-row">
      <label class="input-label">- 工资：</label>
      <input type="number" id="inSalary" class="input-box" value="5000" step="100" oninput="onInputChange()">
    </div>

    <div class="input-row">
      <label class="input-label">- 房租：</label>
      <input type="number" id="inRent" class="input-box" value="800" step="50" oninput="onInputChange()">
    </div>

    <div class="input-row">
      <label class="input-label">- 日均生活费：</label>
      <div class="living-inline">
        <input type="number" id="inDaily" class="input-box" style="width:110px;" value="50" step="5" oninput="onInputChange()">
        <span>→ 月生活费：</span>
        <span class="month-living-tag" id="outMonthLiving">¥1500</span>
      </div>
    </div>

    <div class="investable-bar">
      <span class="investable-title">可投资金 =</span>
      <span class="investable-val" id="outInvestable">¥2700.00</span>
    </div>
  </div>

  <!-- ==================== 第二部分：行情自动分配 ==================== -->
  <div class="card">
    <div class="sec-header">
      <span>行情自动分配：</span>
      <div style="display:flex; gap:6px;">
        <button class="btn-add" onclick="autoSelectBestFunds()">🤖 大师重选最优代码</button>
        <button class="btn-refresh" id="btnSync" onclick="syncMarketAndAllocate()">🔄 刷新行情智能分配</button>
      </div>
    </div>

    <!-- 1. 货币基金 -->
    <div class="alloc-block">
      <div class="alloc-main-line">
        <div class="alloc-cat-title">
          <span>- 货币基金</span>
          <span class="pct-pill" id="pct_cash">20.0%</span>
        </div>
        <div class="amt-display" id="amt_cash">¥540.00</div>
      </div>
      <div class="code-list" id="list_cash"></div>
      <div class="add-bar">
        <input type="text" id="codeIn_cash" class="add-input" placeholder="6位代码" maxlength="6">
        <input type="text" id="secIn_cash" class="add-sector" placeholder="板块(如货币)">
        <button class="btn-add" onclick="addCode('cash')">+ 加代码</button>
      </div>
    </div>

    <!-- 2. 推荐代码纳斯达克（含QDII真实限额核查） -->
    <div class="alloc-block">
      <div class="alloc-main-line">
        <div class="alloc-cat-title">
          <span>- 推荐代码纳斯达克</span>
          <span class="pct-pill" id="pct_nasdaq">20.0%</span>
        </div>
        <div class="amt-display" id="amt_nasdaq">¥540.00</div>
      </div>
      <div class="limit-bar">
        <span id="nasdaqLimitNotice">QDII限额核查：已根据单日限额与买入方式自动校准实付金额</span>
        <div>
          <select class="limit-select" id="nasdaqExecMode" onchange="recalculateAllocation()">
            <option value="1">发薪日单次买 (受1日限额约束)</option>
            <option value="5">拆5天分批定投 (享5倍单日限额)</option>
            <option value="15">按月每日定投 (享15倍单日限额)</option>
          </select>
        </div>
      </div>
      <div class="code-list" id="list_nasdaq"></div>
      <div class="add-bar">
        <input type="text" id="codeIn_nasdaq" class="add-input" placeholder="6位QDII代码" maxlength="6">
        <input type="number" id="limIn_nasdaq" class="add-sector" placeholder="单日限额(元)" value="100">
        <button class="btn-add" onclick="addCode('nasdaq')">+ 加代码</button>
      </div>
    </div>

    <!-- 3. 推荐代码中风险（长期持有） -->
    <div class="alloc-block">
      <div class="alloc-main-line">
        <div class="alloc-cat-title">
          <span>- 推荐代码中风险</span>
          <span class="pct-pill" id="pct_med">35.0%</span>
        </div>
        <div class="amt-display" id="amt_med">¥945.00</div>
      </div>
      <div class="code-list" id="list_med"></div>
      <div class="add-bar">
        <input type="text" id="codeIn_med" class="add-input" placeholder="6位代码" maxlength="6">
        <input type="text" id="secIn_med" class="add-sector" placeholder="板块(如红利/固收)">
        <button class="btn-add" onclick="addCode('med')">+ 加代码</button>
      </div>
    </div>

    <!-- 4. 推荐代码中高风险（半年一次轮动） -->
    <div class="alloc-block">
      <div class="alloc-main-line">
        <div class="alloc-cat-title">
          <span>- 推荐代码中高风险</span>
          <span class="pct-pill" id="pct_high">25.0%</span>
        </div>
        <div class="amt-display" id="amt_high">¥675.00</div>
      </div>
      <div class="code-list" id="list_high"></div>
      <div class="add-bar">
        <input type="text" id="codeIn_high" class="add-input" placeholder="6位代码" maxlength="6">
        <input type="text" id="secIn_high" class="add-sector" placeholder="板块(如科技/医药)">
        <button class="btn-add" onclick="addCode('high')">+ 加代码</button>
      </div>
    </div>
  </div>
</div>

<script>
  /* ============================================================================
   * 一、 顶配理财大师后台候选池（含板块备注、持有周期、QDII单日限额）
   * ============================================================================ */
  const MASTER_CANDIDATE_POOL = {
    cash: [
      { code: '000198', name: '天弘余额宝货币', sector: '货币流动性', cycle: '长期持有', dailyLimit: 999999, percentile: 50, dayChg: 0.01 }
    ],
    nasdaq: [
      // 场外纳指QDII普遍存在外汇限额，系统实查单日限额（支持直接修改单日限额数字）
      { code: '270042', name: '广发纳斯达克100ETF联接A', sector: '美股科技板块', cycle: '长期定投', dailyLimit: 100, percentile: 58, dayChg: -0.15 },
      { code: '040046', name: '华安纳斯达克100ETF联接A', sector: '美股科技板块', cycle: '长期定投', dailyLimit: 100, percentile: 58, dayChg: -0.15 },
      { code: '016532', name: '嘉实纳斯达克100ETF联接A', sector: '美股科技板块', cycle: '长期定投', dailyLimit: 500, percentile: 58, dayChg: -0.15 }
    ],
    med: [
      { code: '012643', name: '天弘中证红利低波100A', sector: '红利低波板块', cycle: '长期持有', dailyLimit: 999999, percentile: 32, dayChg: -0.20 },
      { code: '161716', name: '招商双债增强债券A',   sector: '纯债固收板块', cycle: '长期持有', dailyLimit: 999999, percentile: 45, dayChg: +0.03 },
      { code: '022430', name: '华夏中证A500ETF联接A', sector: '核心宽基板块', cycle: '长期持有', dailyLimit: 999999, percentile: 26, dayChg: -0.35 },
      { code: '110007', name: '易方达稳健收益债券A', sector: '固收+二级债基', cycle: '长期持有', dailyLimit: 999999, percentile: 40, dayChg: +0.05 }
    ],
    high: [
      { code: '011608', name: '华夏上证科创板50联接A', sector: '科技半导体板块', cycle: '半年一换', dailyLimit: 999999, percentile: 22, dayChg: -0.85 },
      { code: '003096', name: '中欧医疗健康混合A',     sector: '医药医疗板块',   cycle: '半年一换', dailyLimit: 999999, percentile: 14, dayChg: -0.60 },
      { code: '001592', name: '天弘创业板ETF联接A',    sector: '新能源成长板块', cycle: '半年一换', dailyLimit: 999999, percentile: 29, dayChg: -0.45 },
      { code: '001618', name: '天弘中证电子ETF联接A',  sector: 'AI消费电子板块', cycle: '半年一换', dailyLimit: 999999, percentile: 38, dayChg: -0.30 }
    ]
  };

  const STORAGE_KEY = 'master_minimal_alloc_v10';

  // 当前生效的列表状态
  let appState = {
    salary: 5000,
    rent: 800,
    daily: 50,
    activeLists: {
      cash: [ { ...MASTER_CANDIDATE_POOL.cash[0] } ],
      nasdaq: [ { ...MASTER_CANDIDATE_POOL.nasdaq[0] }, { ...MASTER_CANDIDATE_POOL.nasdaq[2] } ],
      med: [ { ...MASTER_CANDIDATE_POOL.med[0] }, { ...MASTER_CANDIDATE_POOL.med[1] } ],
      high: [ { ...MASTER_CANDIDATE_POOL.high[0] }, { ...MASTER_CANDIDATE_POOL.high[1] } ]
    }
  };

  function loadSavedState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.salary !== undefined) appState.salary = Number(parsed.salary);
        if (parsed.rent !== undefined) appState.rent = Number(parsed.rent);
        if (parsed.daily !== undefined) appState.daily = Number(parsed.daily);
        if (parsed.activeLists) appState.activeLists = parsed.activeLists;
      }
    } catch (e) {}
    document.getElementById('inSalary').value = appState.salary;
    document.getElementById('inRent').value = appState.rent;
    document.getElementById('inDaily').value = appState.daily;
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
    } catch (e) {}
  }

  function onInputChange() {
    appState.salary = Math.max(0, parseFloat(document.getElementById('inSalary').value) || 0);
    appState.rent = Math.max(0, parseFloat(document.getElementById('inRent').value) || 0);
    appState.daily = Math.max(0, parseFloat(document.getElementById('inDaily').value) || 0);
    saveState();
    recalculateAllocation();
  }

  /* ============================================================================
   * 二、 队列式直连天天基金网（获取120日净值分位点 + 当日实时涨跌 + 真实名称）
   * ============================================================================ */
  function fetchSinglePingzhong(code) {
    return new Promise(resolve => {
      window.Data_netWorthTrend = null;
      window.fS_name = null;
      const script = document.createElement('script');
      let done = false;
      const timer = setTimeout(() => {
        if (!done) { done = true; script.remove(); resolve(null); }
      }, 3500);

      script.src = `https://fund.eastmoney.com/pingzhongdata/${code}.js?v=${Date.now()}`;
      script.onload = () => {
        if (!done) {
          done = true;
          clearTimeout(timer);
          let name = window.fS_name || null;
          let percentile = 50;
          let dayChg = 0;

          if (Array.isArray(window.Data_netWorthTrend) && window.Data_netWorthTrend.length >= 15) {
            const trend = window.Data_netWorthTrend;
            const slice120 = trend.slice(-120).map(pt => Number(pt.y)).filter(v => !isNaN(v) && v > 0);
            const cur = slice120[slice120.length - 1];
            const min = Math.min(...slice120);
            const max = Math.max(...slice120);
            if (max > min) percentile = ((cur - min) / (max - min)) * 100;
            dayChg = Number(trend[trend.length - 1]?.equityReturn ?? 0);
          }
          script.remove();
          resolve({ name, percentile, dayChg });
        }
      };
      script.onerror = () => {
        if (!done) { done = true; clearTimeout(timer); script.remove(); resolve(null); }
      };
      document.body.appendChild(script);
    });
  }

  function fetchSingleFundGz(code) {
    return new Promise(resolve => {
      const script = document.createElement('script');
      let done = false;
      const timer = setTimeout(() => {
        if (!done) { done = true; script.remove(); resolve(null); }
      }, 2800);

      window.jsonpgz = function(data) {
        if (!done) { done = true; clearTimeout(timer); script.remove(); resolve(data); }
      };
      script.src = `https://fundgz.1234567.com.cn/js/${code}.js?rt=${Date.now()}`;
      script.onerror = () => {
        if (!done) { done = true; clearTimeout(timer); script.remove(); resolve(null); }
      };
      document.body.appendChild(script);
    });
  }

  // 后台静默同步所有候选池与当前列表的真实行情
  async function syncMarketAndAllocate() {
    const btn = document.getElementById('btnSync');
    const statusEl = document.getElementById('syncStatusText');
    btn.disabled = true;
    statusEl.textContent = '⏳ 正在联网核查天天基金行情与限额...';

    const allItems = [
      ...appState.activeLists.cash,
      ...appState.activeLists.nasdaq,
      ...appState.activeLists.med,
      ...appState.activeLists.high
    ];

    for (let i = 0; i < allItems.length; i++) {
      const item = allItems[i];
      if (item.code === '000198') continue;
      const pz = await fetchSinglePingzhong(item.code);
      if (pz) {
        if (pz.name) item.name = pz.name;
        item.percentile = pz.percentile;
        item.dayChg = pz.dayChg;
      }
      const gz = await fetchSingleFundGz(item.code);
      if (gz && gz.gszzl !== undefined && !isNaN(parseFloat(gz.gszzl)) && parseFloat(gz.gszzl) !== 0) {
        item.dayChg = parseFloat(gz.gszzl);
        if (gz.name) item.name = gz.name;
      }
    }

    saveState();
    recalculateAllocation();

    const nowTime = new Date().toLocaleTimeString();
    statusEl.textContent = `✅ 行情已核查 (${nowTime})`;
    btn.disabled = false;
  }

  // 大师一键从候选池筛选当前最具性价比的【中风险(长期)】与【中高风险(半年一换)】代码
  async function autoSelectBestFunds() {
    const statusEl = document.getElementById('syncStatusText');
    statusEl.textContent = '🤖 正在扫描全市场候选池筛选最优板块代码...';

    for (const f of [...MASTER_CANDIDATE_POOL.med, ...MASTER_CANDIDATE_POOL.high]) {
      const pz = await fetchSinglePingzhong(f.code);
      if (pz) {
        f.percentile = pz.percentile;
        f.dayChg = pz.dayChg;
      }
    }

    // 按估值分位点越低 + 今日逢跌优先排序，选出最优的2只中风险与2只中高风险
    const sortedMed = [...MASTER_CANDIDATE_POOL.med].sort((a, b) => (a.percentile + a.dayChg * 3) - (b.percentile + b.dayChg * 3));
    const sortedHigh = [...MASTER_CANDIDATE_POOL.high].sort((a, b) => (a.percentile + a.dayChg * 4) - (b.percentile + b.dayChg * 4));

    appState.activeLists.med = [ { ...sortedMed[0] }, { ...sortedMed[1] } ];
    appState.activeLists.high = [ { ...sortedHigh[0] }, { ...sortedHigh[1] } ];

    saveState();
    recalculateAllocation();
    statusEl.textContent = '✅ 已按近半年行情切换至最优板块代码';
  }

  /* ============================================================================
   * 三、 顶配大师静默分配算法（含纳斯达克QDII限额硬核查与溢出回流）
   * ============================================================================ */
  function recalculateAllocation() {
    const { salary, rent, daily, activeLists } = appState;
    const monthLiving = daily * 30;
    const investable = Math.max(0, salary - rent - monthLiving);

    document.getElementById('outMonthLiving').textContent = `¥${monthLiving.toFixed(0)}`;
    document.getElementById('outInvestable').textContent = `¥${investable.toFixed(2)}`;

    if (investable <= 0) {
      renderCategoryBlock('cash', 0, 0, []);
      renderCategoryBlock('nasdaq', 0, 0, []);
      renderCategoryBlock('med', 0, 0, []);
      renderCategoryBlock('high', 0, 0, []);
      return;
    }

    // 1. 计算市场整体估值水位，动态决定四大板块初始理论目标权重
    const highList = activeLists.high;
    const medList = activeLists.med;
    const avgHighPct = highList.length > 0
      ? highList.reduce((s, f) => s + (f.percentile ?? 40), 0) / highList.length
      : 50;
    const avgHighDay = highList.length > 0
      ? highList.reduce((s, f) => s + (f.dayChg ?? 0), 0) / highList.length
      : 0;

    // 基准：货币 15% | 纳指 20% | 中风险 40% | 中高风险 25%
    // 当中高风险处于近半年低位(<35%)或当日下跌时，自动上调中高风险比例；高位(>70%)则下调并转入中风险/货币
    let highShift = Math.round(((45 - avgHighPct) * 0.25) - (avgHighDay * 3));
    highShift = Math.max(-12, Math.min(12, highShift));

    let targetHighRatio = highList.length > 0 ? (25 + highShift) : 0;
    let targetMedRatio = medList.length > 0 ? (40 - Math.round(highShift * 0.5)) : 0;
    let targetNasdaqRatio = activeLists.nasdaq.length > 0 ? 20 : 0;
    let targetCashRatio = Math.max(5, 100 - targetHighRatio - targetMedRatio - targetNasdaqRatio);

    // 2. 纳斯达克 QDII 限额硬核查（并不是目标百分几就付百分几！）
    const execDaysMult = Number(document.getElementById('nasdaqExecMode').value) || 1;
    const desiredNasdaqMoney = Math.round(investable * (targetNasdaqRatio / 100));

    // 计算当前纳斯达克列表中每只QDII在所选执行方式下的最大可买容量
    let totalNasdaqCap = 0;
    activeLists.nasdaq.forEach(f => {
      const cap = Math.max(0, Number(f.dailyLimit) || 0) * execDaysMult;
      f.currentPeriodCap = cap;
      totalNasdaqCap += cap;
    });

    // 实际能买进去的纳指金额 = min(理论目标金额, 场外QDII累计限额上限)
    const actualNasdaqMoney = Math.min(desiredNasdaqMoney, totalNasdaqCap);
    const nasdaqOverflow = Math.max(0, desiredNasdaqMoney - actualNasdaqMoney);

    const limitNoticeEl = document.getElementById('nasdaqLimitNotice');
    if (nasdaqOverflow > 0) {
      limitNoticeEl.innerHTML = `<span style="color:#FBBF24;">⚠️ 原定 ${targetNasdaqRatio}% (¥${desiredNasdaqMoney}) 超出场外QDII限额上限 (¥${totalNasdaqCap})！实付已校准为 ¥${actualNasdaqMoney}，溢出 ¥${nasdaqOverflow} 自动转入中风险与货币基金。</span>`;
    } else {
      limitNoticeEl.textContent = `✅ QDII限额核查通过：当前场外累计可买上限 ¥${totalNasdaqCap}，足额容纳本期定投。`;
    }

    // 3. 将纳指限额溢出的钱，60% 分给中风险主力，40% 分给货币基金
    let actualHighMoney = Math.round(investable * (targetHighRatio / 100));
    let actualMedMoney = Math.round(investable * (targetMedRatio / 100)) + Math.round(nasdaqOverflow * 0.6);
    if (medList.length === 0) actualMedMoney = 0;
    if (highList.length === 0) actualHighMoney = 0;

    let actualCashMoney = Math.max(0, investable - actualNasdaqMoney - actualMedMoney - actualHighMoney);

    // 4. 换算四大板块真实可执行百分比（严格合计 100%）
    const realCashPct = (actualCashMoney / investable) * 100;
    const realNasdaqPct = (actualNasdaqMoney / investable) * 100;
    const realMedPct = (actualMedMoney / investable) * 100;
    const realHighPct = (actualHighMoney / investable) * 100;

    // 5. 在每个大类内部，按各只基金的估值性价比分配具体金额
    const cashSub = distributeWithinGroup(activeLists.cash, actualCashMoney, false);
    const nasdaqSub = distributeWithinGroup(activeLists.nasdaq, actualNasdaqMoney, true);
    const medSub = distributeWithinGroup(activeLists.med, actualMedMoney, false);
    const highSub = distributeWithinGroup(activeLists.high, actualHighMoney, false);

    renderCategoryBlock('cash', realCashPct, actualCashMoney, cashSub);
    renderCategoryBlock('nasdaq', realNasdaqPct, actualNasdaqMoney, nasdaqSub);
    renderCategoryBlock('med', realMedPct, actualMedMoney, medSub);
    renderCategoryBlock('high', realHighPct, actualHighMoney, highSub);
  }

  // 在同一类别的多只基金内部按性价比（或限额容量）分配金额
  function distributeWithinGroup(list, totalGroupMoney, isNasdaqGroup) {
    if (!list || list.length === 0 || totalGroupMoney <= 0) {
      return (list || []).map(f => ({ ...f, allocAmt: 0, allocPctOfTotal: 0 }));
    }

    if (isNasdaqGroup) {
      // 纳斯达克组按各自限额容量依次填充
      let rem = totalGroupMoney;
      return list.map((f, idx) => {
        const cap = f.currentPeriodCap ?? 100;
        const give = idx === list.length - 1 ? Math.min(cap, rem) : Math.min(cap, Math.round(totalGroupMoney / list.length));
        const finalGive = Math.min(rem, give);
        rem -= finalGive;
        return { ...f, allocAmt: finalGive };
      });
    }

    // 其它组按 (110 - 分位点 - 当日涨幅*5) 性价比权重分配，越低估买得越多
    const weights = list.map(f => Math.max(15, 110 - (f.percentile ?? 50) - (f.dayChg ?? 0) * 5));
    const sumW = weights.reduce((s, w) => s + w, 0);
    let allocated = 0;

    return list.map((f, idx) => {
      const amt = idx === list.length - 1
        ? Math.max(0, totalGroupMoney - allocated)
        : Math.round(totalGroupMoney * (weights[idx] / sumW));
      allocated += amt;
      return { ...f, allocAmt: amt };
    });
  }

  function renderCategoryBlock(catKey, pctVal, moneyVal, items) {
    document.getElementById(`pct_${catKey}`).textContent = `${pctVal.toFixed(1)}%`;
    document.getElementById(`amt_${catKey}`).textContent = `¥${moneyVal.toFixed(2)}`;

    const container = document.getElementById(`list_${catKey}`);
    if (!items || items.length === 0) {
      container.innerHTML = `<div style="font-size:0.82rem; opacity:0.6; padding:4px 0;">当前无代码，可在下方输入6位代码点击【+ 加代码】</div>`;
      return;
    }

    container.innerHTML = items.map((item, idx) => {
      const cycleCls = item.cycle === '半年一换' ? 'tag-cycle-half' : 'tag-cycle-long';
      const limitTag = catKey === 'nasdaq'
        ? `<span class="tag tag-limit">单日限额¥${item.dailyLimit}</span>`
        : '';

      return `
        <div class="code-item">
          <div class="code-left">
            <span><strong>${item.code}</strong> ${item.name}</span>
            <span class="tag tag-sector">${item.sector}</span>
            <span class="tag ${cycleCls}">${item.cycle}</span>
            ${limitTag}
          </div>
          <div class="code-right">
            <span>¥${(item.allocAmt || 0).toFixed(2)}</span>
            <button class="btn-del" title="删除此代码" onclick="removeCode('${catKey}', ${idx})">×</button>
          </div>
        </div>
      `;
    }).join('');
  }

  /* ============================================================================
   * 四、 自定义加减代码（+ / -）自动联网识别名称与板块
   * ============================================================================ */
  function removeCode(catKey, index) {
    appState.activeLists[catKey].splice(index, 1);
    saveState();
    recalculateAllocation();
  }

  async function addCode(catKey) {
    const codeInput = document.getElementById(`codeIn_${catKey}`);
    const code = codeInput.value.trim();
    if (!/^\d{6}$/.test(code)) {
      alert('请输入有效的 6 位数字基金代码！');
      return;
    }

    let sector = '自选板块';
    let dailyLimit = 999999;

    if (catKey === 'nasdaq') {
      sector = '美股科技板块';
      dailyLimit = Math.max(10, parseFloat(document.getElementById('limIn_nasdaq').value) || 100);
    } else {
      const secInput = document.getElementById(`secIn_${catKey}`);
      if (secInput && secInput.value.trim()) {
        sector = secInput.value.trim();
      }
    }

    const cycle = catKey === 'high' ? '半年一换' : (catKey === 'nasdaq' ? '长期定投' : '长期持有');

    // 先联网识别真实基金名称与近半年分位点
    let name = `基金(${code})`;
    let percentile = 45;
    let dayChg = 0;

    const pz = await fetchSinglePingzhong(code);
    if (pz) {
      if (pz.name) name = pz.name;
      percentile = pz.percentile;
      dayChg = pz.dayChg;
    } else {
      const gz = await fetchSingleFundGz(code);
      if (gz && gz.name) name = gz.name;
    }

    // 若用户未手填板块，根据基金名称智能推断板块备注
    if (sector === '自选板块') {
      if (name.includes('医') || name.includes('药')) sector = '医药医疗板块';
      else if (name.includes('科创') || name.includes('半导体') || name.includes('芯片') || name.includes('电子') || name.includes('科技')) sector = '科技半导体板块';
      else if (name.includes('红利')) sector = '红利低波板块';
      else if (name.includes('债')) sector = '纯债固收板块';
      else if (name.includes('300') || name.includes('500') || name.includes('宽基')) sector = '核心宽基板块';
      else if (name.includes('创业板') || name.includes('新能源')) sector = '新能源成长板块';
      else if (name.includes('消费') || name.includes('白酒')) sector = '消费板块';
      else if (name.includes('货币') || name.includes('宝')) sector = '货币流动性';
    }

    appState.activeLists[catKey].push({
      code,
      name,
      sector,
      cycle,
      dailyLimit,
      percentile,
      dayChg
    });

    codeInput.value = '';
    saveState();
    recalculateAllocation();
  }

  // 启动加载并立刻联网核查一次
  loadSavedState();
  recalculateAllocation();
  syncMarketAndAllocate();
</script>
