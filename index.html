<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>极简智能行情定投分配系统（终极完全体）</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: #0B1120;
    padding: 20px 14px 50px;
    line-height: 1.55;
  }

  .container {
    max-width: 620px;
    margin: 0 auto;
  }

  .card {
    background-color: #1E293B;
    border: 1.5px solid #475569;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
  }

  .sec-header {
    font-size: 1.15rem;
    font-weight: 900;
    padding-bottom: 12px;
    margin-bottom: 16px;
    border-bottom: 1.5px solid #334155;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  /* 输入区行样式 */
  .input-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 10px;
    flex-wrap: wrap;
  }

  .input-label {
    font-size: 1rem;
    font-weight: 800;
    min-width: 110px;
  }

  .input-box {
    background-color: #0F172A;
    border: 1.5px solid #64748B;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 1.15rem;
    font-weight: 800;
    font-family: Consolas, Monaco, monospace;
    width: 150px;
    text-align: right;
    outline: none;
  }

  .input-box:focus {
    border-color: #FFFFFF;
    background-color: #020617;
  }

  .living-inline {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
    flex: 1;
  }

  .month-living-tag {
    background-color: #0F172A;
    border: 1px solid #475569;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 800;
    font-family: Consolas, Monaco, monospace;
  }

  .investable-bar {
    margin-top: 14px;
    padding: 14px 16px;
    background-color: #0F172A;
    border: 2px solid #10B981;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .investable-title {
    font-size: 1.1rem;
    font-weight: 900;
  }

  .investable-val {
    font-size: 1.75rem;
    font-weight: 900;
    font-family: Consolas, Monaco, monospace;
    color: #10B981;
  }

  /* 按钮样式 */
  .btn-refresh {
    background-color: #10B981;
    border: 1.5px solid #FFFFFF;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 0.86rem;
    font-weight: 900;
    cursor: pointer;
  }

  .btn-refresh:active { transform: scale(0.97); }
  .btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; }

  /* 四大分配区块 */
  .alloc-block {
    background-color: #0F172A;
    border: 1.5px solid #334155;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }

  .alloc-block:last-child { margin-bottom: 0; }

  .alloc-main-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding-bottom: 10px;
    border-bottom: 1px dashed #334155;
  }

  .alloc-cat-title {
    font-size: 1.05rem;
    font-weight: 900;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .pct-pill {
    background-color: #1E293B;
    border: 1.5px solid #94A3B8;
    padding: 2px 9px;
    border-radius: 6px;
    font-family: Consolas, Monaco, monospace;
    font-size: 1rem;
    font-weight: 900;
  }

  .amt-display {
    font-size: 1.45rem;
    font-weight: 900;
    font-family: Consolas, Monaco, monospace;
    color: #10B981;
    white-space: nowrap;
  }

  /* 推荐基金代码子项 */
  .code-list {
    margin-top: 10px;
  }

  .code-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: rgba(255, 255, 255, 0.05);
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 6px;
    gap: 8px;
    flex-wrap: wrap;
  }

  .code-left {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    font-size: 0.9rem;
    font-weight: 700;
  }

  .tag {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 800;
  }

  .tag-sector { background-color: #1D4ED8; border: 1px solid #60A5FA; }
  .tag-cycle-long { background-color: #047857; border: 1px solid #34D399; }
  .tag-cycle-half { background-color: #B45309; border: 1px solid #FBBF24; }
  .tag-limit { background-color: #7C2D12; border: 1px solid #FB923C; }

  .code-right {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: Consolas, Monaco, monospace;
    font-weight: 800;
    font-size: 0.95rem;
  }

  .btn-del {
    background-color: rgba(239, 68, 68, 0.3);
    border: 1px solid #EF4444;
    border-radius: 5px;
    padding: 1px 7px;
    font-size: 0.8rem;
    font-weight: 900;
    cursor: pointer;
  }

  /* 加减代码操作栏 */
  .add-bar {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .add-input {
    background-color: #1E293B;
    border: 1px solid #64748B;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 0.82rem;
    font-family: Consolas, Monaco, monospace;
    width: 95px;
    outline: none;
  }

  .add-sector {
    background-color: #1E293B;
    border: 1px solid #64748B;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 0.82rem;
    width: 115px;
    outline: none;
  }

  .btn-add {
    background-color: #334155;
    border: 1px solid #94A3B8;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 0.8rem;
    font-weight: 800;
    cursor: pointer;
  }

  .btn-add:active { transform: scale(0.97); }

  /* 辅助微调行 */
  .sub-ctrl-bar {
    margin-top: 6px;
    font-size: 0.78rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    opacity: 0.92;
  }

  .limit-select {
    background-color: #1E293B;
    border: 1px solid #64748B;
    border-radius: 5px;
    padding: 2px 6px;
    font-size: 0.78rem;
    font-weight: 700;
  }

  .switch-label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 800;
    background-color: #1E293B;
    border: 1px solid #64748B;
    padding: 3px 8px;
    border-radius: 6px;
  }
</style>
</head>
<body>

<div class="container">
  <!-- ==================== 第一部分：输入区 ==================== -->
  <div class="card">
    <div class="sec-header">
      <span>输入：</span>
      <span id="syncStatusText" style="font-size:0.78rem; font-weight:normal; opacity:0.9;">正在连接多源行情系统...</span>
    </div>

    <div class="input-row">
      <label class="input-label">- 工资：</label>
      <input type="number" id="inSalary" class="input-box" value="5000" step="100" oninput="onInputChange()">
    </div>

    <div class="input-row">
      <label class="input-label">- 房租：</label>
      <input type="number" id="inRent" class="input-box" value="800" step="50" oninput="onInputChange()">
    </div>

    <div class="input-row">
      <label class="input-label">- 日均生活费：</label>
      <div class="living-inline">
        <input type="number" id="inDaily" class="input-box" style="width:110px;" value="50" step="5" oninput="onInputChange()">
        <span>→ 月生活费：</span>
        <span class="month-living-tag" id="outMonthLiving">¥1500</span>
      </div>
    </div>

    <div class="investable-bar">
      <span class="investable-title">可投资金 =</span>
      <span class="investable-val" id="outInvestable">¥2700.00</span>
    </div>
  </div>

  <!-- ==================== 第二部分：行情自动分配 ==================== -->
  <div class="card">
    <div class="sec-header">
      <span>行情自动分配：</span>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <button class="btn-add" onclick="autoSelectBestFunds()">🤖 按行情重选最优代码</button>
        <button class="btn-refresh" id="btnSync" onclick="syncMarketAndAllocate()">🔄 刷新行情智能分配</button>
      </div>
    </div>

    <!-- 1. 货币基金（含“应急金已存满(0%)”智能开关） -->
    <div class="alloc-block">
      <div class="alloc-main-line">
        <div class="alloc-cat-title">
          <span>- 货币基金</span>
          <span class="pct-pill" id="pct_cash">15.0%</span>
        </div>
        <div class="amt-display" id="amt_cash">¥405.00</div>
      </div>
      <div class="sub-ctrl-bar">
        <span id="cashRoleNotice">紧急备用金 + 暴跌补仓弹药库</span>
        <label class="switch-label">
          <input type="checkbox" id="cashFullToggle" onchange="onCashToggleChange()">
          应急金已存满（全投基金）
        </label>
      </div>
      <div class="code-list" id="list_cash"></div>
      <div class="add-bar">
        <input type="text" id="codeIn_cash" class="add-input" placeholder="6位代码" maxlength="6">
        <input type="text" id="secIn_cash" class="add-sector" placeholder="板块(如货币)">
        <button class="btn-add" onclick="addCode('cash')">+ 加代码</button>
      </div>
    </div>

    <!-- 2. 推荐代码纳斯达克（含QDII真实限额核查 + 估值自适应） -->
    <div class="alloc-block">
      <div class="alloc-main-line">
        <div class="alloc-cat-title">
          <span>- 推荐代码纳斯达克</span>
          <span class="pct-pill" id="pct_nasdaq">20.0%</span>
        </div>
        <div class="amt-display" id="amt_nasdaq">¥540.00</div>
      </div>
      <div class="sub-ctrl-bar">
        <span id="nasdaqLimitNotice">QDII限额核查：已按行情与场外限额校准实付金额</span>
        <select class="limit-select" id="nasdaqExecMode" onchange="onExecModeChange()">
          <option value="1">发薪日单次买 (受1日限额约束)</option>
          <option value="5" selected>拆5天分批定投 (享5倍单日限额)</option>
          <option value="15">按月每日定投 (享15倍单日限额)</option>
        </select>
      </div>
      <div class="code-list" id="list_nasdaq"></div>
      <div class="add-bar">
        <input type="text" id="codeIn_nasdaq" class="add-input" placeholder="6位QDII代码" maxlength="6">
        <input type="number" id="limIn_nasdaq" class="add-sector" placeholder="单日限额(元)" value="100">
        <button class="btn-add" onclick="addCode('nasdaq')">+ 加代码</button>
      </div>
    </div>

    <!-- 3. 推荐代码中风险（长期持有） -->
    <div class="alloc-block">
      <div class="alloc-main-line">
        <div class="alloc-cat-title">
          <span>- 推荐代码中风险</span>
          <span class="pct-pill" id="pct_med">40.0%</span>
        </div>
        <div class="amt-display" id="amt_med">¥1080.00</div>
      </div>
      <div class="code-list" id="list_med"></div>
      <div class="add-bar">
        <input type="text" id="codeIn_med" class="add-input" placeholder="6位代码" maxlength="6">
        <input type="text" id="secIn_med" class="add-sector" placeholder="板块(如红利/固收)">
        <button class="btn-add" onclick="addCode('med')">+ 加代码</button>
      </div>
    </div>

    <!-- 4. 推荐代码中高风险（半年一次轮动） -->
    <div class="alloc-block">
      <div class="alloc-main-line">
        <div class="alloc-cat-title">
          <span>- 推荐代码中高风险</span>
          <span class="pct-pill" id="pct_high">25.0%</span>
        </div>
        <div class="amt-display" id="amt_high">¥675.00</div>
      </div>
      <div class="code-list" id="list_high"></div>
      <div class="add-bar">
        <input type="text" id="codeIn_high" class="add-input" placeholder="6位代码" maxlength="6">
        <input type="text" id="secIn_high" class="add-sector" placeholder="板块(如科技/医药)">
        <button class="btn-add" onclick="addCode('high')">+ 加代码</button>
      </div>
    </div>
  </div>
</div>

<script>
  /* ============================================================================
   * 一、 顶配大师全市场精选候选池（覆盖各大核心板块，后台根据实时行情自动PK筛选）
   * ============================================================================ */
  const MASTER_CANDIDATE_POOL = {
    cash: [
      { code: '000198', name: '天弘余额宝货币', sector: '货币流动性', cycle: '长期持有', dailyLimit: 999999, percentile: 50, maBias: 0, maxDD: 0, dayChg: 0.01 }
    ],
    nasdaq: [
      { code: '270042', name: '广发纳斯达克100ETF联接A', sector: '美股科技板块', cycle: '长期定投', dailyLimit: 100, percentile: 55, maBias: 1.2, maxDD: -6.5, dayChg: -0.15 },
      { code: '016532', name: '嘉实纳斯达克100ETF联接A', sector: '美股科技板块', cycle: '长期定投', dailyLimit: 500, percentile: 55, maBias: 1.2, maxDD: -6.5, dayChg: -0.15 },
      { code: '040046', name: '华安纳斯达克100ETF联接A', sector: '美股科技板块', cycle: '长期定投', dailyLimit: 100, percentile: 55, maBias: 1.2, maxDD: -6.5, dayChg: -0.15 }
    ],
    med: [
      { code: '012643', name: '天弘中证红利低波100A', sector: '红利低波板块', cycle: '长期持有', dailyLimit: 999999, percentile: 30, maBias: -1.5, maxDD: -8.2, dayChg: -0.25 },
      { code: '161716', name: '招商双债增强债券A',   sector: '纯债固收板块', cycle: '长期持有', dailyLimit: 999999, percentile: 42, maBias: 0.2,  maxDD: -1.1, dayChg: +0.03 },
      { code: '022430', name: '华夏中证A500ETF联接A', sector: '核心宽基板块', cycle: '长期持有', dailyLimit: 999999, percentile: 24, maBias: -2.8, maxDD: -12.4, dayChg: -0.40 },
      { code: '110020', name: '易方达沪深300ETF联接A', sector: '蓝筹宽基板块', cycle: '长期持有', dailyLimit: 999999, percentile: 26, maBias: -2.3, maxDD: -11.8, dayChg: -0.35 },
      { code: '110007', name: '易方达稳健收益债券A', sector: '固收+二级债基', cycle: '长期持有', dailyLimit: 999999, percentile: 38, maBias: 0.4,  maxDD: -2.0, dayChg: +0.04 }
    ],
    high: [
      { code: '011608', name: '华夏上证科创板50联接A', sector: '科技半导体板块', cycle: '半年一换', dailyLimit: 999999, percentile: 19, maBias: -4.5, maxDD: -18.5, dayChg: -0.95 },
      { code: '003096', name: '中欧医疗健康混合A',     sector: '医药医疗板块',   cycle: '半年一换', dailyLimit: 999999, percentile: 12, maBias: -5.2, maxDD: -22.0, dayChg: -0.65 },
      { code: '001592', name: '天弘创业板ETF联接A',    sector: '新能源成长板块', cycle: '半年一换', dailyLimit: 999999, percentile: 25, maBias: -3.1, maxDD: -16.8, dayChg: -0.50 },
      { code: '001618', name: '天弘中证电子ETF联接A',  sector: 'AI消费电子板块', cycle: '半年一换', dailyLimit: 999999, percentile: 34, maBias: -1.8, maxDD: -14.2, dayChg: -0.30 },
      { code: '004854', name: '广发中证传媒ETF联接A',  sector: 'AI游戏传媒板块', cycle: '半年一换', dailyLimit: 999999, percentile: 31, maBias: -2.0, maxDD: -15.5, dayChg: -0.40 }
    ]
  };

  const STORAGE_KEY = 'master_minimal_ultimate_v12';

  let appState = {
    salary: 5000,
    rent: 800,
    daily: 50,
    cashFull: false,
    nasdaqExecMode: 5,
    activeLists: {
      cash: [ { ...MASTER_CANDIDATE_POOL.cash[0] } ],
      nasdaq: [ { ...MASTER_CANDIDATE_POOL.nasdaq[0] }, { ...MASTER_CANDIDATE_POOL.nasdaq[1] } ],
      med: [ { ...MASTER_CANDIDATE_POOL.med[0] }, { ...MASTER_CANDIDATE_POOL.med[1] } ],
      high: [ { ...MASTER_CANDIDATE_POOL.high[0] }, { ...MASTER_CANDIDATE_POOL.high[1] } ]
    }
  };

  function loadSavedState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.salary !== undefined) appState.salary = Number(parsed.salary);
        if (parsed.rent !== undefined) appState.rent = Number(parsed.rent);
        if (parsed.daily !== undefined) appState.daily = Number(parsed.daily);
        if (parsed.cashFull !== undefined) appState.cashFull = Boolean(parsed.cashFull);
        if (parsed.nasdaqExecMode !== undefined) appState.nasdaqExecMode = Number(parsed.nasdaqExecMode);
        if (parsed.activeLists) appState.activeLists = parsed.activeLists;
      }
    } catch (e) {}
    document.getElementById('inSalary').value = appState.salary;
    document.getElementById('inRent').value = appState.rent;
    document.getElementById('inDaily').value = appState.daily;
    document.getElementById('cashFullToggle').checked = appState.cashFull;
    document.getElementById('nasdaqExecMode').value = String(appState.nasdaqExecMode);
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
    } catch (e) {}
  }

  function onInputChange() {
    appState.salary = Math.max(0, parseFloat(document.getElementById('inSalary').value) || 0);
    appState.rent = Math.max(0, parseFloat(document.getElementById('inRent').value) || 0);
    appState.daily = Math.max(0, parseFloat(document.getElementById('inDaily').value) || 0);
    saveState();
    recalculateAllocation();
  }

  function onCashToggleChange() {
    appState.cashFull = document.getElementById('cashFullToggle').checked;
    saveState();
    recalculateAllocation();
  }

  function onExecModeChange() {
    appState.nasdaqExecMode = Number(document.getElementById('nasdaqExecMode').value) || 1;
    saveState();
    recalculateAllocation();
  }

  /* ============================================================================
   * 二、 多源行情静默抓取（天天基金 120日净值序列 + 盘中实时估值 + 东财宽基指数）
   * ============================================================================ */
  // 1. 解析天天基金 pingzhongdata：提取真实基金名、120日净值分位点、60日均线乖离率、最大回撤、最新收盘涨跌
  function fetchSinglePingzhong(code) {
    return new Promise(resolve => {
      window.Data_netWorthTrend = null;
      window.fS_name = null;
      const script = document.createElement('script');
      let done = false;
      const timer = setTimeout(() => {
        if (!done) { done = true; script.remove(); resolve(null); }
      }, 3500);

      script.src = `https://fund.eastmoney.com/pingzhongdata/${code}.js?v=${Date.now()}`;
      script.onload = () => {
        if (!done) {
          done = true;
          clearTimeout(timer);
          let name = window.fS_name || null;
          let percentile = 50;
          let maBias = 0;
          let maxDD = -5;
          let dayChg = 0;

          if (Array.isArray(window.Data_netWorthTrend) && window.Data_netWorthTrend.length >= 20) {
            const trend = window.Data_netWorthTrend;
            const slice120 = trend.slice(-120).map(pt => Number(pt.y)).filter(v => !isNaN(v) && v > 0);
            const len = slice120.length;
            const cur = slice120[len - 1];
            const min = Math.min(...slice120);
            const max = Math.max(...slice120);

            if (max > min) percentile = ((cur - min) / (max - min)) * 100;
            maxDD = ((cur - max) / max) * 100;

            const ma60Slice = slice120.slice(-Math.min(60, len));
            const ma60 = ma60Slice.reduce((s, v) => s + v, 0) / ma60Slice.length;
            if (ma60 > 0) maBias = ((cur - ma60) / ma60) * 100;

            dayChg = Number(trend[trend.length - 1]?.equityReturn ?? 0);
          }
          script.remove();
          resolve({ name, percentile, maBias, maxDD, dayChg });
        }
      };
      script.onerror = () => {
        if (!done) { done = true; clearTimeout(timer); script.remove(); resolve(null); }
      };
      document.body.appendChild(script);
    });
  }

  // 2. 抓取天天基金盘中实时估值涨跌幅
  function fetchSingleFundGz(code) {
    return new Promise(resolve => {
      const script = document.createElement('script');
      let done = false;
      const timer = setTimeout(() => {
        if (!done) { done = true; script.remove(); resolve(null); }
      }, 2500);

      window.jsonpgz = function(data) {
        if (!done) { done = true; clearTimeout(timer); script.remove(); resolve(data); }
      };
      script.src = `https://fundgz.1234567.com.cn/js/${code}.js?rt=${Date.now()}`;
      script.onerror = () => {
        if (!done) { done = true; clearTimeout(timer); script.remove(); resolve(null); }
      };
      document.body.appendChild(script);
    });
  }

  // 同步当前激活列表的所有基金最新行情并重算百分比
  async function syncMarketAndAllocate() {
    const btn = document.getElementById('btnSync');
    const statusEl = document.getElementById('syncStatusText');
    btn.disabled = true;
    statusEl.textContent = '⏳ 正在实时分析全市场行情与限额...';

    const allItems = [
      ...appState.activeLists.cash,
      ...appState.activeLists.nasdaq,
      ...appState.activeLists.med,
      ...appState.activeLists.high
    ];

    for (let i = 0; i < allItems.length; i++) {
      const item = allItems[i];
      if (item.code === '000198') continue;

      const pz = await fetchSinglePingzhong(item.code);
      if (pz) {
        if (pz.name) item.name = pz.name;
        item.percentile = pz.percentile;
        item.maBias = pz.maBias;
        item.maxDD = pz.maxDD;
        item.dayChg = pz.dayChg;
      }

      const gz = await fetchSingleFundGz(item.code);
      if (gz && gz.gszzl !== undefined && !isNaN(parseFloat(gz.gszzl)) && parseFloat(gz.gszzl) !== 0) {
        item.dayChg = parseFloat(gz.gszzl);
        if (gz.name) item.name = gz.name;
      }
    }

    saveState();
    recalculateAllocation();

    statusEl.textContent = `✅ 行情分配已更新 (${new Date().toLocaleTimeString()})`;
    btn.disabled = false;
  }

  // 大师一键扫描整个候选库，自动挑选当期最具性价比的「中风险(长期)」与「中高风险(半年一换)」代码
  async function autoSelectBestFunds() {
    const statusEl = document.getElementById('syncStatusText');
    const btn = document.getElementById('btnSync');
    btn.disabled = true;
    statusEl.textContent = '🤖 正在扫描全市场候选库筛选当期最优代码...';

    const candidates = [...MASTER_CANDIDATE_POOL.med, ...MASTER_CANDIDATE_POOL.high];
    for (let i = 0; i < candidates.length; i++) {
      const f = candidates[i];
      const pz = await fetchSinglePingzhong(f.code);
      if (pz) {
        f.percentile = pz.percentile;
        f.maBias = pz.maBias;
        f.maxDD = pz.maxDD;
        f.dayChg = pz.dayChg;
      }
    }

    // 计算每只候选基金的综合低吸价值分（分位越低、均线负乖离越大、回撤越深、当日越跌，得分越高）
    const scoreFn = (f) => {
      const pScore = (100 - (f.percentile ?? 50)) * 0.50;
      const biasScore = Math.max(-15, Math.min(15, -(f.maBias ?? 0))) * 1.5;
      const ddScore = Math.min(25, Math.abs(f.maxDD ?? 5)) * 0.8;
      const dayScore = -(f.dayChg ?? 0) * 4.0;
      return pScore + biasScore + ddScore + dayScore;
    };

    // 中风险选出1只最优宽基/红利 + 1只纯债防守压舱
    const medEquities = MASTER_CANDIDATE_POOL.med.filter(f => !f.sector.includes('债')).sort((a, b) => scoreFn(b) - scoreFn(a));
    const medBonds = MASTER_CANDIDATE_POOL.med.filter(f => f.sector.includes('债'));
    appState.activeLists.med = [
      { ...(medEquities[0] || MASTER_CANDIDATE_POOL.med[0]) },
      { ...(medBonds[0] || MASTER_CANDIDATE_POOL.med[1]) }
    ];

    // 中高风险（半年一换）选出综合性价比最高的前 2 只不同板块代码
    const sortedHigh = [...MASTER_CANDIDATE_POOL.high].sort((a, b) => scoreFn(b) - scoreFn(a));
    appState.activeLists.high = [
      { ...sortedHigh[0] },
      { ...sortedHigh[1] }
    ];

    saveState();
    recalculateAllocation();
    statusEl.textContent = '✅ 已按最新行情换入最优板块代码';
    btn.disabled = false;
  }

  /* ============================================================================
   * 三、 四维量化大师分配引擎（每个月投百分之几 100% 随行情动态变化 + 纳指限额实查）
   * ============================================================================ */
  // 计算单只基金的实时低吸吸引力指数 (10 ~ 100)
  function computeAttractiveness(f) {
    const pct = f.percentile ?? 50;
    const bias = f.maBias ?? 0;
    const dd = Math.abs(f.maxDD ?? 5);
    const day = f.dayChg ?? 0;

    // 越处于半年低位、越低于60日均线、回撤越深、今日越跌 -> 吸引力越高
    const raw = (100 - pct) * 0.55 + Math.max(-12, Math.min(15, -bias)) * 1.4 + Math.min(25, dd) * 0.6 - day * 3.5;
    return Math.max(10, Math.min(100, raw));
  }

  function recalculateAllocation() {
    const { salary, rent, daily, cashFull, activeLists } = appState;
    const monthLiving = daily * 30;
    const investable = Math.max(0, salary - rent - monthLiving);

    document.getElementById('outMonthLiving').textContent = `¥${monthLiving.toFixed(0)}`;
    document.getElementById('outInvestable').textContent = `¥${investable.toFixed(2)}`;

    if (investable <= 0) {
      renderCategoryBlock('cash', 0, 0, []);
      renderCategoryBlock('nasdaq', 0, 0, []);
      renderCategoryBlock('med', 0, 0, []);
      renderCategoryBlock('high', 0, 0, []);
      return;
    }

    // 1. 计算各大类的实时行情温度与吸引力
    const highList = activeLists.high;
    const medList = activeLists.med;
    const nasdaqList = activeLists.nasdaq;

    const avgHighAttr = highList.length > 0
      ? highList.reduce((s, f) => s + computeAttractiveness(f), 0) / highList.length
      : 50;
    const avgMedAttr = medList.length > 0
      ? medList.reduce((s, f) => s + computeAttractiveness(f), 0) / medList.length
      : 50;
    const avgNdxPct = nasdaqList.length > 0
      ? nasdaqList.reduce((s, f) => s + (f.percentile ?? 55), 0) / nasdaqList.length
      : 55;
    const avgNdxDay = nasdaqList.length > 0
      ? nasdaqList.reduce((s, f) => s + (f.dayChg ?? 0), 0) / nasdaqList.length
      : 0;

    // 2. 根据行情动态计算【货币、纳指、中风险、中高风险】四大板块的理论百分比
    // (A) 纳斯达克理论比例：基准 20%，随美股半年分位点与当日涨跌在 12% ~ 28% 之间智能浮动（若超88%极度高估则压至8%）
    let rawNasdaqPct = 20 + ((50 - avgNdxPct) * 0.14) - (avgNdxDay * 1.5);
    if (avgNdxPct > 88) rawNasdaqPct = 8;
    rawNasdaqPct = nasdaqList.length > 0 ? Math.max(8, Math.min(28, rawNasdaqPct)) : 0;

    // (B) 货币基金主动留存比例：
    // 若用户勾选了“应急金已存满”，主动留存为 0%；
    // 若未勾选，则基准 15%，且当大盘高估(吸引力低)时自动多留现金(最高25%)，大盘低估抄底时自动少留现金(最低8%)
    let rawCashPct = 0;
    const cashNoticeEl = document.getElementById('cashRoleNotice');
    if (cashFull || activeLists.cash.length === 0) {
      rawCashPct = 0;
      cashNoticeEl.textContent = '⚡ 已开启【应急金存满模式】：主动留存 0%，资金全额投入基金滚雪球';
    } else {
      rawCashPct = Math.max(8, Math.min(25, 15 + (50 - avgHighAttr) * 0.18));
      cashNoticeEl.textContent = '🛡️ 应急金储备中：比例随行情高低在 8%~25% 之间智能伸缩';
    }

    // (C) 剩余比例在「中风险」与「中高风险」之间按实时行情吸引力动态分配
    const remainForEqAndBond = Math.max(0, 100 - rawCashPct - rawNasdaqPct);
    let rawHighPct = 0;
    let rawMedPct = 0;

    if (highList.length > 0 && medList.length > 0) {
      // 当中高风险板块（科技/医药/创业板）大跌处于低位时，avgHighAttr 升高，中高风险占比可在 15% ~ 48% 间大幅摆动
      const highShare = Math.max(0.22, Math.min(0.62, 0.38 + (avgHighAttr - 50) * 0.0055));
      rawHighPct = remainForEqAndBond * highShare;
      rawMedPct = remainForEqAndBond - rawHighPct;
    } else if (highList.length > 0) {
      rawHighPct = remainForEqAndBond;
    } else if (medList.length > 0) {
      rawMedPct = remainForEqAndBond;
    } else {
      rawCashPct += remainForEqAndBond;
    }

    // 3. 纳斯达克场外 QDII 限额硬核查（绝不盲目按百分比算钱！）
    const execMult = Number(document.getElementById('nasdaqExecMode').value) || 1;
    const desiredNasdaqMoney = Math.round(investable * (rawNasdaqPct / 100));

    let totalNasdaqCap = 0;
    nasdaqList.forEach(f => {
      const cap = Math.max(0, Number(f.dailyLimit) || 0) * execMult;
      f.currentPeriodCap = cap;
      totalNasdaqCap += cap;
    });

    const actualNasdaqMoney = Math.min(desiredNasdaqMoney, totalNasdaqCap);
    const nasdaqOverflow = Math.max(0, desiredNasdaqMoney - actualNasdaqMoney);

    const limitNoticeEl = document.getElementById('nasdaqLimitNotice');
    if (nasdaqOverflow > 0) {
      limitNoticeEl.innerHTML = `<span style="color:#FBBF24;">⚠️ 行情目标 ${rawNasdaqPct.toFixed(1)}% (¥${desiredNasdaqMoney}) 触发QDII限购上限 (¥${totalNasdaqCap})！实付已校准为 ¥${actualNasdaqMoney}，溢出 ¥${nasdaqOverflow} 已按行情自动转入其他基金。</span>`;
    } else {
      limitNoticeEl.textContent = `✅ QDII限额核查通过：当前累计限额上限 ¥${totalNasdaqCap}，可足额买入行情目标金额。`;
    }

    // 4. 处理纳指限额溢出资金的去向：
    // 若勾选了“应急金已存满”，溢出资金优先按吸引力分给【中风险】和【中高风险】；若未勾选，则分给【中风险】和【货币基金】
    let actualHighMoney = Math.round(investable * (rawHighPct / 100));
    let actualMedMoney = Math.round(investable * (rawMedPct / 100));

    if (nasdaqOverflow > 0) {
      if (cashFull) {
        // 应急金已满：如果当前中高风险处于低位好机会(吸引力>55)，溢出资金 40% 加码中高风险、60% 进中风险；否则全部进中风险稳健固收
        const addHigh = (highList.length > 0 && avgHighAttr > 55) ? Math.round(nasdaqOverflow * 0.4) : 0;
        const addMed = medList.length > 0 ? (nasdaqOverflow - addHigh) : 0;
        actualHighMoney += addHigh;
        actualMedMoney += addMed;
      } else {
        const addMed = medList.length > 0 ? Math.round(nasdaqOverflow * 0.65) : 0;
        actualMedMoney += addMed;
      }
    }

    let actualCashMoney = Math.max(0, investable - actualNasdaqMoney - actualMedMoney - actualHighMoney);

    // 5. 根据真实成交金额反推最终精确百分比（四项严格合计 100.0%）
    const realCashPct = (actualCashMoney / investable) * 100;
    const realNasdaqPct = (actualNasdaqMoney / investable) * 100;
    const realMedPct = (actualMedMoney / investable) * 100;
    const realHighPct = (actualHighMoney / investable) * 100;

    // 6. 在各大类内部，按每只基金各自的四维行情吸引力进行非线性二次方加权分配
    const cashSub = distributeWithinGroup(activeLists.cash, actualCashMoney, false);
    const nasdaqSub = distributeWithinGroup(activeLists.nasdaq, actualNasdaqMoney, true);
    const medSub = distributeWithinGroup(activeLists.med, actualMedMoney, false);
    const highSub = distributeWithinGroup(activeLists.high, actualHighMoney, false);

    renderCategoryBlock('cash', realCashPct, actualCashMoney, cashSub);
    renderCategoryBlock('nasdaq', realNasdaqPct, actualNasdaqMoney, nasdaqSub);
    renderCategoryBlock('med', realMedPct, actualMedMoney, medSub);
    renderCategoryBlock('high', realHighPct, actualHighMoney, highSub);
  }

  // 组内多只基金按行情性价比二次方拉开差距分配
  function distributeWithinGroup(list, totalGroupMoney, isNasdaqGroup) {
    if (!list || list.length === 0 || totalGroupMoney <= 0) {
      return (list || []).map(f => ({ ...f, allocAmt: 0 }));
    }

    if (isNasdaqGroup) {
      let rem = totalGroupMoney;
      return list.map((f, idx) => {
        const cap = f.currentPeriodCap ?? 100;
        const targetShare = idx === list.length - 1 ? rem : Math.round(totalGroupMoney / list.length);
        const finalGive = Math.min(rem, cap, targetShare);
        rem -= finalGive;
        return { ...f, allocAmt: finalGive };
      });
    }

    // 二次方加权：让同组内跌得深、分位点更低的基金明显多买
    const poweredWeights = list.map(f => Math.pow(computeAttractiveness(f), 1.6));
    const sumW = poweredWeights.reduce((s, w) => s + w, 0);
    let allocated = 0;

    return list.map((f, idx) => {
      const amt = idx === list.length - 1
        ? Math.max(0, totalGroupMoney - allocated)
        : Math.round(totalGroupMoney * (poweredWeights[idx] / sumW));
      allocated += amt;
      return { ...f, allocAmt: amt };
    });
  }

  function renderCategoryBlock(catKey, pctVal, moneyVal, items) {
    document.getElementById(`pct_${catKey}`).textContent = `${pctVal.toFixed(1)}%`;
    document.getElementById(`amt_${catKey}`).textContent = `¥${moneyVal.toFixed(2)}`;

    const container = document.getElementById(`list_${catKey}`);
    if (!items || items.length === 0) {
      container.innerHTML = `<div style="font-size:0.82rem; opacity:0.6; padding:4px 0;">当前无代码，可在下方输入6位代码点击【+ 加代码】</div>`;
      return;
    }

    container.innerHTML = items.map((item, idx) => {
      const cycleCls = item.cycle === '半年一换' ? 'tag-cycle-half' : 'tag-cycle-long';
      const limitTag = catKey === 'nasdaq'
        ? `<span class="tag tag-limit">单日限额¥${item.dailyLimit}</span>`
        : '';

      return `
        <div class="code-item">
          <div class="code-left">
            <span><strong>${item.code}</strong> ${item.name}</span>
            <span class="tag tag-sector">${item.sector}</span>
            <span class="tag ${cycleCls}">${item.cycle}</span>
            ${limitTag}
          </div>
          <div class="code-right">
            <span>¥${(item.allocAmt || 0).toFixed(2)}</span>
            <button class="btn-del" title="删除此代码" onclick="removeCode('${catKey}', ${idx})">×</button>
          </div>
        </div>
      `;
    }).join('');
  }

  /* ============================================================================
   * 四、 自定义加减代码（+ / -）自动联网识别名称、板块与行情分位
   * ============================================================================ */
  function removeCode(catKey, index) {
    appState.activeLists[catKey].splice(index, 1);
    saveState();
    recalculateAllocation();
  }

  async function addCode(catKey) {
    const codeInput = document.getElementById(`codeIn_${catKey}`);
    const code = codeInput.value.trim();
    if (!/^\d{6}$/.test(code)) {
      alert('请输入有效的 6 位数字基金代码！');
      return;
    }

    let sector = '自选板块';
    let dailyLimit = 999999;

    if (catKey === 'nasdaq') {
      sector = '美股科技板块';
      dailyLimit = Math.max(10, parseFloat(document.getElementById('limIn_nasdaq').value) || 100);
    } else {
      const secInput = document.getElementById(`secIn_${catKey}`);
      if (secInput && secInput.value.trim()) {
        sector = secInput.value.trim();
      }
    }

    const cycle = catKey === 'high' ? '半年一换' : (catKey === 'nasdaq' ? '长期定投' : '长期持有');

    let name = `基金(${code})`;
    let percentile = 45;
    let maBias = 0;
    let maxDD = -8;
    let dayChg = 0;

    const pz = await fetchSinglePingzhong(code);
    if (pz) {
      if (pz.name) name = pz.name;
      percentile = pz.percentile;
      maBias = pz.maBias;
      maxDD = pz.maxDD;
      dayChg = pz.dayChg;
    } else {
      const gz = await fetchSingleFundGz(code);
      if (gz && gz.name) name = gz.name;
    }

    // 根据基金名称自动归类板块备注
    if (sector === '自选板块') {
      if (name.includes('医') || name.includes('药')) sector = '医药医疗板块';
      else if (name.includes('科创') || name.includes('半导体') || name.includes('芯片') || name.includes('电子') || name.includes('科技')) sector = '科技半导体板块';
      else if (name.includes('红利')) sector = '红利低波板块';
      else if (name.includes('债')) sector = '纯债固收板块';
      else if (name.includes('300') || name.includes('500') || name.includes('宽基')) sector = '核心宽基板块';
      else if (name.includes('创业板') || name.includes('新能源')) sector = '新能源成长板块';
      else if (name.includes('消费') || name.includes('白酒')) sector = '消费板块';
      else if (name.includes('传媒') || name.includes('游戏') || name.includes('人工智能')) sector = 'AI传媒板块';
      else if (name.includes('货币') || name.includes('宝')) sector = '货币流动性';
    }

    appState.activeLists[catKey].push({
      code,
      name,
      sector,
      cycle,
      dailyLimit,
      percentile,
      maBias,
      maxDD,
      dayChg
    });

    codeInput.value = '';
    saveState();
    recalculateAllocation();
  }

  // 页面启动即加载本地记忆并联网同步最新行情分配
  loadSavedState();
  recalculateAllocation();
  syncMarketAndAllocate();
</script>
