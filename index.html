<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>极简全球资产定投计算器</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    color: #FFFFFF; /* 强制全局所有文字纯白色 */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: #0F172A; /* 深蓝灰底色，护眼且与白字形成极致对比 */
    padding: 24px 16px 50px;
    line-height: 1.6;
  }

  .container {
    max-width: 520px;
    margin: 0 auto;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 800;
    text-align: center;
    margin-bottom: 20px;
    letter-spacing: 0.5px;
  }

  /* 卡片通用深色容器 */
  .card {
    background-color: #1E293B;
    border: 1.5px solid #475569;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
  }

  /* 三个输入框极简布局 */
  .input-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 18px;
  }

  @media (max-width: 440px) {
    .input-grid {
      grid-template-columns: 1fr;
    }
  }

  .field label {
    display: block;
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    background-color: #0F172A;
    border: 1.5px solid #64748B;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 1.2rem;
    font-weight: 800;
    font-family: Consolas, Monaco, monospace;
    color: #FFFFFF;
    outline: none;
  }

  .field input:focus {
    border-color: #FFFFFF;
    background-color: #020617;
  }

  /* 醒目主按钮 */
  .btn-main {
    width: 100%;
    background-color: #10B981;
    border: 1.5px solid #FFFFFF;
    border-radius: 12px;
    padding: 14px;
    font-size: 1.08rem;
    font-weight: 900;
    cursor: pointer;
    letter-spacing: 0.5px;
  }

  .btn-main:active {
    transform: scale(0.98);
  }

  .btn-main:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* 结果展示区 */
  .status-bar {
    font-size: 0.85rem;
    font-weight: 700;
    padding: 6px 12px;
    background-color: #0F172A;
    border: 1px solid #475569;
    border-radius: 8px;
    margin-bottom: 16px;
    text-align: center;
  }

  .total-box {
    border-bottom: 1.5px dashed #475569;
    padding-bottom: 16px;
    margin-bottom: 16px;
    text-align: center;
  }

  .total-title {
    font-size: 0.95rem;
    font-weight: 700;
  }

  .total-num {
    font-size: 2.4rem;
    font-weight: 900;
    font-family: Consolas, Monaco, monospace;
    margin: 4px 0;
  }

  . pocket-tip {
    font-size: 0.88rem;
    background-color: rgba(255, 255, 255, 0.08);
    padding: 6px 10px;
    border-radius: 6px;
    display: inline-block;
    margin-top: 4px;
  }

  /* 每一条买基指令行 */
  .plan-item {
    background-color: #0F172A;
    border: 1px solid #475569;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }

  .plan-item:last-child {
    margin-bottom: 0;
  }

  .plan-title {
    font-size: 1.02rem;
    font-weight: 800;
    margin-bottom: 6px;
  }

  .plan-detail {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.95rem;
    font-weight: 700;
    padding-top: 6px;
    border-top: 1px solid #1E293B;
  }

  .buy-highlight {
    font-size: 1.35rem;
    font-weight: 900;
    font-family: Consolas, Monaco, monospace;
  }
</style>
</head>
<body>

<div class="container">
  <h1>🌍 极简全球资产定投方案</h1>

  <!-- 1. 输入区：仅保留三个核心输入框 + 一个生成按钮 -->
  <div class="card">
    <div class="input-grid">
      <div class="field">
        <label>月收入 (¥)</label>
        <input type="number" id="inIncome" value="5000" step="100">
      </div>
      <div class="field">
        <label>每日开销 (¥)</label>
        <input type="number" id="inDaily" value="50" step="5">
      </div>
      <div class="field">
        <label>房租 (¥)</label>
        <input type="number" id="inRent" value="800" step="50">
      </div>
    </div>

    <button class="btn-main" id="btnRun" onclick="generatePlan()">
      ⚡ 一键生成本月买基方案
    </button>
  </div>

  <!-- 2. 输出区：极简大白话结果卡片 -->
  <div class="card" id="resultCard">
    <div class="status-bar" id="marketStatus">
      📡 点击上方按钮，自动读取今日行情并计算金额
    </div>

    <div class="total-box">
      <div class="total-title">本月可定投总额（结余的 80%）</div>
      <div class="total-num" id="outInvestTotal">¥0</div>
      <div class="pocket-tip" id="outPocketMoney">
        💬 另外 20%（¥0）留在微信零钱里备用
      </div>
    </div>

    <div id="planList">
      <div class="plan-item">
        <div class="plan-title" id="titleNasdaq">🇺🇸 纳斯达克100（帮你买美股）</div>
        <div class="plan-detail">
          <span id="ratioNasdaq">分配 40%（基石固定）</span>
          <span class="buy-highlight" id="amtNasdaq">→ 买入 ¥0</span>
        </div>
      </div>

      <div class="plan-item">
        <div class="plan-title" id="titleAshares">🇨🇳 沪深300 / 中证A500（A股宽基）</div>
        <div class="plan-detail">
          <span id="ratioAshares">分配 30%</span>
          <span class="buy-highlight" id="amtAshares">→ 买入 ¥0</span>
        </div>
      </div>

      <div class="plan-item">
        <div class="plan-title" id="titleBond">🛡️ 纯债 / 余额宝（防守备用）</div>
        <div class="plan-detail">
          <span id="ratioBond">分配 30%</span>
          <span class="buy-highlight" id="amtBond">→ 买入 ¥0</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'minimal_global_invest_v1';

  // 读取上次输入的数字
  function loadSavedInputs() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      if (saved.income !== undefined) document.getElementById('inIncome').value = saved.income;
      if (saved.daily !== undefined) document.getElementById('inDaily').value = saved.daily;
      if (saved.rent !== undefined) document.getElementById('inRent').value = saved.rent;
    } catch (e) {}
  }

  // 获取当天沪深300与纳斯达克行情（优先使用东方财富公开CORS接口，若失败自动保底常规比例）
  async function fetchTodayMarketChange() {
    try {
      // secids: 1.000300 (沪深300), 100.NDX (纳斯达克100)
      const url = 'https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&fields=f12,f14,f3&secids=1.000300,100.NDX';
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 3000);

      const response = await fetch(url, { signal: controller.signal });
      clearTimeout(timeout);

      const json = await response.json();
      const diff = json?.data?.diff || [];
      const hs300 = diff.find(item => item.f12 === '000300');
      const ndx = diff.find(item => item.f12 === 'NDX');

      return {
        ok: true,
        hs300Change: hs300 && typeof hs300.f3 === 'number' ? hs300.f3 : 0,
        ndxChange: ndx && typeof ndx.f3 === 'number' ? ndx.f3 : 0
      };
    } catch (e) {
      return { ok: false, hs300Change: 0, ndxChange: 0 };
    }
  }

  async function generatePlan() {
    const btn = document.getElementById('btnRun');
    const statusEl = document.getElementById('marketStatus');
    btn.disabled = true;
    btn.textContent = '⏳ 正在读取今日行情...';

    // 1. 获取并保存三个输入值
    const income = Math.max(0, parseFloat(document.getElementById('inIncome').value) || 0);
    const daily = Math.max(0, parseFloat(document.getElementById('inDaily').value) || 0);
    const rent = Math.max(0, parseFloat(document.getElementById('inRent').value) || 0);

    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ income, daily, rent }));
    } catch (e) {}

    // 2. 计算结余与可定投总额：总收入 - (日开销 × 30) - 房租
    const totalSurplus = Math.max(0, income - (daily * 30) - rent);
    const investPool = Math.round(totalSurplus * 0.80); // 80% 用于定投
    const wechatReserve = totalSurplus - investPool;    // 20% 留在微信零钱备用

    // 3. 抓取当天 A股（沪深300）与纳指行情
    const market = await fetchTodayMarketChange();

    // 4. 按规则决定比例：纳指固定 40%，A股与纯债在 20%~40% 动态跷跷板
    const nasdaqPct = 40;
    let aSharePct = 30;
    let bondPct = 30;
    let aShareComment = '今天震荡平稳，正常买';

    if (market.ok) {
      const chg = market.hs300Change;
      const sign = chg > 0 ? '+' : '';
      const ndxSign = market.ndxChange > 0 ? '+' : '';

      if (chg <= -1.0) {
        // A股跌幅超过 1%：打折了，提高 A股到 40%，降低纯债到 20%
        aSharePct = 40;
        bondPct = 20;
        aShareComment = `今天跌了 ${chg.toFixed(2)}% 打折，多买点`;
      } else if (chg >= 1.0) {
        // A股涨幅超过 1%：贵了，降低 A股到 20%，提高纯债到 40%
        aSharePct = 20;
        bondPct = 40;
        aShareComment = `今天涨了 +${chg.toFixed(2)}% 偏贵，少买点`;
      } else {
        // 震荡市（涨跌幅在 -1% ~ +1% 之间）：各 30%
        aSharePct = 30;
        bondPct = 30;
        aShareComment = `今天波动不大 (${sign}${chg.toFixed(2)}%)，按标准买`;
      }

      statusEl.textContent = `✅ 今日行情：沪深300 (${sign}${chg.toFixed(2)}%) | 纳指100 (${ndxSign}${market.ndxChange.toFixed(2)}%)`;
    } else {
      statusEl.textContent = '⚡ 当前为离线/非交易时段，已按标准稳健比例（40% : 30% : 30%）生成';
    }

    // 5. 计算具体买入金额（精确到整数元）
    const nasdaqAmt = Math.round(investPool * (nasdaqPct / 100));
    const aShareAmt = Math.round(investPool * (aSharePct / 100));
    const bondAmt = Math.max(0, investPool - nasdaqAmt - aShareAmt);

    // 6. 渲染页面大白话结果
    document.getElementById('outInvestTotal').textContent = `¥${investPool}`;
    document.getElementById('outPocketMoney').textContent =
      `💬 结余共 ¥${totalSurplus}：拿 80%（¥${investPool}）定投，另外 20%（¥${wechatReserve}）留在微信零钱里备用`;

    document.getElementById('titleNasdaq').textContent = `🇺🇸 纳斯达克100（帮你买美股）`;
    document.getElementById('ratioNasdaq').textContent = `分配 ${nasdaqPct}%（雷打不动基石）`;
    document.getElementById('amtNasdaq').textContent = `→ 买入 ¥${nasdaqAmt}`;

    document.getElementById('titleAshares').textContent = `🇨🇳 沪深300（${aShareComment}）`;
    document.getElementById('ratioAshares').textContent = `分配 ${aSharePct}%`;
    document.getElementById('amtAshares').textContent = `→ 买入 ¥${aShareAmt}`;

    document.getElementById('titleBond').textContent = `🛡️ 纯债 / 余额宝（防守备用）`;
    document.getElementById('ratioBond').textContent = `分配 ${bondPct}%`;
    document.getElementById('amtBond').textContent = `→ 买入 ¥${bondAmt}`;

    btn.disabled = false;
    btn.textContent = '⚡ 一键生成本月买基方案';
  }

  // 页面打开时自动载入上次输入并生成一次
  loadSavedInputs();
  generatePlan();
</script>

</body>
</html>
