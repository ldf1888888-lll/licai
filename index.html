<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简全球资产定投计算器</title>
    <style>
        :root {
            --bg-color: #0f172a; /* 极简深蓝灰背景 */
            --card-bg: #1e293b; /* 卡片背景 */
            --text-main: #ffffff; /* 纯白正文 */
            --text-sub: #94a3b8; /* 辅助浅灰 */
            --green: #10b981; /* 买入绿 */
            --red: #ef4444; /* 下跌红 */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .input-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1.1rem;
            box-sizing: border-box;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--green);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--green);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        button:active {
            opacity: 0.8;
        }

        .market-info {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 15px;
        }

        .total-box {
            text-align: center;
            margin-bottom: 20px;
        }

        .total-box .label {
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .total-box .amount {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--text-main);
            margin: 5px 0;
        }

        .total-box .note {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .result-card {
            background-color: var(--card-bg);
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-left: 4px solid var(--green);
        }

        .result-card.bond {
            border-left-color: #3b82f6; /* 纯债用蓝色边 */
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .result-reason {
            font-size: 0.85rem;
            color: var(--text-sub);
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 10px;
            border-radius: 6px;
            line-height: 1.4;
        }

        .result-action {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 5px;
        }

        .result-ratio {
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .result-money {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--green);
        }
        
        .result-card.bond .result-money {
            color: #3b82f6;
        }

        /* 隐藏状态 */
        #results-section {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎯 极简全球资产定投系统</h1>

    <div class="input-card">
        <div class="input-group">
            <label>本月到账工资 (¥)</label>
            <input type="number" id="income" value="5500" placeholder="如: 5500">
        </div>
        <div class="input-group">
            <label>每日生活费 (¥/天)</label>
            <input type="number" id="dailylife" value="25" placeholder="如: 25">
        </div>
        <div class="input-group">
            <label>房租及固定支出 (¥)</label>
            <input type="number" id="rent" value="800" placeholder="如: 800">
        </div>
        <button onclick="calculate()">⚡ 实时抓取行情 · 生成定投方案</button>
    </div>

    <div id="results-section">
        <div class="market-info" id="market-info">行情加载中...</div>
        
        <div class="total-box">
            <div class="label">本月可定投总额 (结余的 80%)</div>
            <div class="amount" id="total-invest">¥0</div>
            <div class="note" id="leftover-note">另外 20% 留在零钱备用</div>
        </div>

        <!-- 纳斯达克卡片 -->
        <div class="result-card" id="card-nasdaq">
            <div class="result-header">
                <span>🇺🇸 纳斯达克100 (美股核心)</span>
            </div>
            <div class="result-reason" id="reason-nasdaq">数据计算中...</div>
            <div class="result-action">
                <div class="result-ratio" id="ratio-nasdaq">分配 40%</div>
                <div class="result-money" id="money-nasdaq">¥0</div>
            </div>
        </div>

        <!-- A股卡片 -->
        <div class="result-card" id="card-a-share">
            <div class="result-header">
                <span>🇨🇳 沪深300 (A股宽基)</span>
            </div>
            <div class="result-reason" id="reason-a-share">数据计算中...</div>
            <div class="result-action">
                <div class="result-ratio" id="ratio-a-share">分配 30%</div>
                <div class="result-money" id="money-a-share">¥0</div>
            </div>
        </div>

        <!-- 纯债卡片 -->
        <div class="result-card bond" id="card-bond">
            <div class="result-header">
                <span>🛡️ 纯债 / 余额宝 (防守)</span>
            </div>
            <div class="result-reason" id="reason-bond">数据计算中...</div>
            <div class="result-action">
                <div class="result-ratio" id="ratio-bond">分配 30%</div>
                <div class="result-money" id="money-bond">¥0</div>
            </div>
        </div>
    </div>
</div>

<script>
    // 格式化金额显示 (如: 1,234.56)
    function formatMoney(amount) {
        return "¥" + amount.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function calculate() {
        // 1. 获取输入值
        const income = parseFloat(document.getElementById('income').value) || 0;
        const dailyLife = parseFloat(document.getElementById('dailylife').value) || 0;
        const rent = parseFloat(document.getElementById('rent').value) || 0;

        // 2. 计算资金池
        const monthlyExpenses = (dailyLife * 30) + rent;
        const surplus = income - monthlyExpenses;
        
        if (surplus <= 0) {
            alert("你的收入不足以覆盖生活费+房租，请调整输入金额！");
            return;
        }

        const investTotal = surplus * 0.8; // 80%用于定投
        const leftover = surplus * 0.2;    // 20%留作备用

        // 3. 模拟获取行情数据 (真实场景下，这里应该用 fetch 请求后端API获取)
        // 模拟纳指涨跌幅 (-3% 到 +3% 之间)
        const nasdaqChange = (Math.random() * 6 - 3).toFixed(2); 
        // 模拟沪深300涨跌幅 (-3% 到 +3% 之间)
        const aShareChange = (Math.random() * 6 - 3).toFixed(2);

        // 4. 动态策略逻辑
        let ratioNasdaq = 0.40;
        let ratioAShare = 0.30;
        let ratioBond = 0.30;

        let reasonNasdaq = `今日涨跌 ${nasdaqChange}%，按基准配置 40%。`;
        let reasonAShare = `今日涨跌 ${aShareChange}%，按基准配置 30%。`;
        let reasonBond = `行情震荡，留存 30% 防守备用。`;

        // 判断纳指大跌 (< -1%)
        if (nasdaqChange < -1) {
            ratioNasdaq = 0.60;
            ratioBond = 0.10;
            reasonNasdaq = `🔥今日大跌 ${nasdaqChange}%，美股打折！防守子弹拿来抄底，加大买入。`;
            reasonBond = `⚠️防守仓位缩减。纳指大跌，资金调拨去抄底美股。`;
        } 
        // 判断纳指大涨 (> 1%)
        else if (nasdaqChange > 1) {
            ratioNasdaq = 0.30;
            ratioBond = 0.40;
            reasonNasdaq = `📈今日大涨 ${nasdaqChange}%，不追高，控制买入金额。`;
            reasonBond = `✅纳指处于高位，防守仓位提升，多存钱等待下次机会。`;
        }
        // 如果纳指没极端波动，再看A股大跌
        else if (aShareChange < -1) {
            ratioAShare = 0.50;
            ratioBond = 0.10;
            reasonAShare = `🔥今日大跌 ${aShareChange}%，A股打折！防守子弹拿来抄底。`;
            reasonBond = `⚠️防守仓位缩减。A股大跌，资金调拨去抄底。`;
        }

        // 5. 计算具体金额
        const buyNasdaq = investTotal * ratioNasdaq;
        const buyAShare = investTotal * ratioAShare;
        const buyBond = investTotal * ratioBond;

        // 6. 渲染到页面
        document.getElementById('market-info').innerHTML = `✅ 今日行情：沪深300 (${aShareChange}%) | 纳指100 (${nasdaqChange}%)`;
        document.getElementById('total-invest').innerText = formatMoney(investTotal);
        document.getElementById('leftover-note').innerText = `结余共 ${formatMoney(surplus)}：拿 80% 定投，另外 ${formatMoney(leftover)} 留在微信零钱备用`;

        // 纳斯达克渲染
        document.getElementById('ratio-nasdaq').innerText = `分配 ${(ratioNasdaq * 100).toFixed(0)}%`;
        document.getElementById('money-nasdaq').innerText = formatMoney(buyNasdaq);
        document.getElementById('reason-nasdaq').innerText = reasonNasdaq;

        // A股渲染
        document.getElementById('ratio-a-share').innerText = `分配 ${(ratioAShare * 100).toFixed(0)}%`;
        document.getElementById('money-a-share').innerText = formatMoney(buyAShare);
        document.getElementById('reason-a-share').innerText = reasonAShare;

        // 纯债渲染
        document.getElementById('ratio-bond').innerText = `分配 ${(ratioBond * 100).toFixed(0)}%`;
        document.getElementById('money-bond').innerText = formatMoney(buyBond);
        document.getElementById('reason-bond').innerText = reasonBond;

        // 显示结果区域
        document.getElementById('results-section').style.display = 'block';
    }
</script>

</body>
</html>
